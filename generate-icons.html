<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<canvas id="c"></canvas>
<script>
const sizes = [72, 96, 128, 192, 512];

async function generateIcon(size) {
  const canvas = document.getElementById('c');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#1E3A8A');
  grad.addColorStop(1, '#3B82F6');
  ctx.fillStyle = grad;

  // Rounded rect
  const r = size * 0.22;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fill();

  // Shield
  const cx = size / 2;
  const cy = size / 2 - size * 0.02;
  const sw = size * 0.42;
  const sh = size * 0.48;

  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = size * 0.04;
  ctx.beginPath();
  ctx.moveTo(cx, cy - sh/2);
  ctx.lineTo(cx + sw/2, cy - sh/4);
  ctx.lineTo(cx + sw/2, cy + sh/6);
  ctx.quadraticCurveTo(cx + sw/2, cy + sh/2, cx, cy + sh/2);
  ctx.quadraticCurveTo(cx - sw/2, cy + sh/2, cx - sw/2, cy + sh/6);
  ctx.lineTo(cx - sw/2, cy - sh/4);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Lock icon in center
  const lw = size * 0.14;
  const lh = size * 0.12;
  const lbw = size * 0.18;
  const lbh = size * 0.15;
  const lx = cx - lbw/2;
  const ly = cy - lh * 0.5;

  // Lock body
  ctx.fillStyle = 'white';
  const br = size * 0.03;
  ctx.beginPath();
  ctx.roundRect(lx, ly, lbw, lbh, br);
  ctx.fill();

  // Lock shackle
  ctx.strokeStyle = 'white';
  ctx.lineWidth = size * 0.04;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(cx, ly, lw * 0.5, Math.PI, 0);
  ctx.stroke();

  // Keyhole
  ctx.fillStyle = '#2563EB';
  ctx.beginPath();
  ctx.arc(cx, ly + lbh * 0.38, size * 0.025, 0, Math.PI * 2);
  ctx.fill();

  return canvas.toDataURL('image/png');
}

async function downloadAll() {
  for (const size of sizes) {
    const dataUrl = await generateIcon(size);
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = `icon-${size}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    await new Promise(r => setTimeout(r, 200));
  }
  document.getElementById('status').textContent = 'All icons downloaded! Place them in the icons/ folder.';
}

document.addEventListener('DOMContentLoaded', () => {
  const btn = document.createElement('button');
  btn.textContent = '⬇️ Download All Icons';
  btn.style.cssText = 'padding:12px 24px;font-size:16px;cursor:pointer;margin:20px;border-radius:8px;background:#2563EB;color:white;border:none';
  btn.onclick = downloadAll;
  document.body.appendChild(btn);

  const status = document.createElement('p');
  status.id = 'status';
  status.style.cssText = 'margin:0 20px;font-family:sans-serif;color:#333';
  document.body.appendChild(status);

  // Auto-preview 192px
  generateIcon(192).then(url => {
    const img = document.createElement('img');
    img.src = url;
    img.style.cssText = 'display:block;margin:20px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.2)';
    document.body.insertBefore(img, btn);
  });
});
</script>
</body>
</html>
